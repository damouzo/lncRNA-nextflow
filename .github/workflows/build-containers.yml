name: Build and push containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/discovery/**'
      - 'containers/coding_potential/**'
      - 'containers/r_bioc/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which container to build'
        required: false
        default: 'all'
        type: choice
        options: [discovery, coding_potential, r_bioc, all]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/lncRNA-nextflow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect changed containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      discovery: ${{ steps.filter.outputs.discovery }}
      coding_potential: ${{ steps.filter.outputs.coding_potential }}
      r_bioc: ${{ steps.filter.outputs.r_bioc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            discovery: ['containers/discovery/**']
            coding_potential: ['containers/coding_potential/**']
            r_bioc: ['containers/r_bioc/**']

  build-discovery:
    name: Build discovery
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.discovery == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'discovery' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/discovery
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push discovery
        uses: docker/build-push-action@v5
        with:
          context: containers/discovery
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discovery
          cache-to: type=gha,mode=max,scope=discovery

  build-coding_potential:
    name: Build coding_potential
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.coding_potential == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'coding_potential' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/coding_potential
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push coding_potential
        uses: docker/build-push-action@v5
        with:
          context: containers/coding_potential
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coding_potential
          cache-to: type=gha,mode=max,scope=coding_potential

  build-r_bioc:
    name: Build r_bioc
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.r_bioc == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'r_bioc' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/r_bioc
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push r_bioc
        uses: docker/build-push-action@v5
        with:
          context: containers/r_bioc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=r_bioc
          cache-to: type=gha,mode=max,scope=r_bioc
