# Example params.yaml for lncRNA-nextflow
# Copy and edit; the pipeline consumes these paths as-is (never downloads).
# Adjust genome/gtf paths to your species/build — the pipeline is species-agnostic.

# ---- Input data (output from nf-core/rnaseq) ----
input:     samplesheet.csv
contrasts: comparisons.csv
outdir:    results

# ---- Reference annotation (species-agnostic) ----
genome: /path/to/genome.fa
gtf:    /path/to/annotation.gtf
# design_formula: '~ batch + condition'

# ---- Library strandedness (single contract) ----
# Drives Salmon (-l ISR/ISF/IU), featureCounts (-s 2/1/0) and StringTie (--rf/--fr/none).
# reverse = fr-firststrand (dUTP), the usual RNA-seq case.
library_strandedness: reverse
# Optional overrides — must be coherent with library_strandedness or the run fails:
# salmon_libtype: ISR
# featurecounts_strandness: 2
# strandedness_min_fidelity: 0.70   # CHECK_STRANDEDNESS warning floor (E/(E+O))
# strandedness_guard_strict: false  # true = low fidelity is a hard failure
# salmon_min_compat_ratio: 0.70     # CHECK_SALMON_LIBTYPE compatible_fragment_ratio floor

# ---- Tier 1 definition (docs/analysis_plan.md) ----
# By default a mono-exonic transcript of any class is demoted to Tier 2 and marked
# single_exon_low_confidence (categorical rule, no derived threshold). Set true to
# keep mono-exonic transcripts in Tier 1.
# tier1_allow_single_exon: false

# ---- F1.3 exploratory flank check (disabled by default) ----
# F1.3 did not pass its pre-specified control separation and does not gate tier_final.
# run_flank_check: false

# ---- Species / build metadata ----
# species is a free-form label used in report/logs only.
# genome_build is REQUIRED whenever conservation_bigwig or synteny_chain_file
# is set — it lets the pipeline verify that external resources share the
# reference assembly (fails fast on mismatch). Any string is fine; it is used
# to match chromosome lengths, not to interpret the build name.
species:      'human'
genome_build: 'hg38'    # free-form; use the UCSC build name matching your bigWig/chain

# ---- Optional: sequence conservation (reporting-only, never a filter) ----
# phastCons/phyloP/GERP bigWig from UCSC, in the SAME build as genome.
conservation_bigwig:    /path/to/reference/conservation/hg38.phastCons100way.bw
conservation_metric:    'phastCons'
conservation_min_score: 0.5

# ---- Optional: synteny / liftOver (reporting-only, never a filter) ----
# Chain file = liftOver from the genome build -> target species build.
# Target GTF = Ensembl GTF of the target species (chromosomes without 'chr',
# normalized automatically against the chain's naming).
synteny_chain_file:     /path/to/reference/liftover/hg38ToMm39.over.chain.gz
synteny_target_species: 'mouse'
synteny_target_gtf:     /path/to/reference/mouse/Mus_musculus.GRCm39.115.gtf

# ---- Optional: reference lncRNA catalogs (reporting-only) ----
# noncode_bed:     /path/to/noncode.bed
# lncipedia_bed:   /path/to/lncipedia.bed
# rnacentral_bed:  /path/to/rnacentral.bed
# fantomcat_bed:   /path/to/fantomcat.bed
